<h1>Tabla MUltiplicar</h1>
<form #multipplicarForm="ngForm" (ngSubmit)="recibirNumero()">
  <label for="">Numero</label>
  <input type="number" [(ngModel)]="numero" #cajaNumero="ngModel" name="cajaNumero" />
  <button>Enviar</button>
</form>

<ul>
    @for(res of resultados; track res;let i=$index){
        <li>{{numero}}*{{i+1}}={{res}}</li>
}
</ul>
